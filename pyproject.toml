[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "AIE2026 exercises and homework repository (develop a learning support agent)"
readme = "README.md"
requires-python = ">=3.12"
# Pin versions to avoid breakage during the course year
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # mcp is used in Lecture 05 (MCP servers and clients)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
